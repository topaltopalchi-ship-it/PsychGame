name: Deploy PsychGame API

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wrangler
        run: npm install --global wrangler

      - name: Verify Cloudflare token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          echo "Verifying Cloudflare API token..."
          curl -sS -f -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/user/tokens/verify" -o /tmp/cf-token.json
          jq -e '.success == true' /tmp/cf-token.json >/dev/null
          echo "Cloudflare token is valid."

      - name: Resolve Cloudflare account
        env:
          CONFIGURED_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${CONFIGURED_ACCOUNT_ID:-}"
          echo "CLOUDFLARE_ACCOUNT_ID=$CONFIGURED_ACCOUNT_ID" >> "$GITHUB_ENV"

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: wrangler deploy --config=worker/wrangler.toml

      - name: Set Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AUTHOR_TOKEN: ${{ secrets.PSYCHGAME_AUTHOR_TOKEN }}
          ADMIN_TOKEN: ${{ secrets.PSYCHGAME_ADMIN_TOKEN }}
        run: |
          printf '%s' "$AUTHOR_TOKEN" | wrangler secret put AUTHOR_TOKEN --config=worker/wrangler.toml
          printf '%s' "$ADMIN_TOKEN" | wrangler secret put ADMIN_TOKEN --config=worker/wrangler.toml

      - name: Verify deployed admin API
        env:
          ADMIN_TOKEN: ${{ secrets.PSYCHGAME_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          status="$(curl -sS -o /tmp/patients.json -w "%{http_code}" \\
            -H "Authorization: Bearer $ADMIN_TOKEN" \\
            "https://psychgame-api.topaltopalchi.workers.dev/api/patients?search=%20")"
          if [ "$status" != "200" ]; then
            echo "::error::Admin API verification failed with HTTP $status"
            cat /tmp/patients.json
            exit 1
          fi
          echo "Admin API verification passed (HTTP 200)."
