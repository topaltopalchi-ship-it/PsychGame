name: Browser Smoke Tests
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: browser-smoke
  cancel-in-progress: true

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run API smoke test
        run: npm run test:api

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Build game
        run: npm run build

      - name: Start preview server
        run: npm run preview -- --host 127.0.0.1 > /tmp/psychgame-preview.log 2>&1 &

      - name: Run cross-browser smoke tests
        run: xvfb-run -a timeout 10m npx playwright test --project=chromium --project=firefox --project=webkit

      - name: Upload Playwright diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: psychgame-playwright-report
          path: |
            playwright-report/
            test-results/

      - name: Upload preview log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: psychgame-preview-log
          path: /tmp/psychgame-preview.log

  clinician-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build game
        run: npm run build

      - name: Start preview server
        run: npm run preview -- --host 127.0.0.1 > /tmp/psychgame-clinician-preview.log 2>&1 &

      - name: Verify clinician authentication
        env:
          PSYCHGAME_ADMIN_TOKEN: ${{ secrets.PSYCHGAME_ADMIN_TOKEN }}
        run: xvfb-run -a timeout 2m npx playwright test tests/clinician-auth.spec.js --project=chromium --trace=off

      - name: Upload clinician diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: psychgame-clinician-diagnostics
          path: |
            playwright-report/
            test-results/
            /tmp/psychgame-clinician-preview.log
